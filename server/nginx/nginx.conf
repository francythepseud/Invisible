# Invisible — Nginx reverse proxy con TLS 1.3
# Tutte le connessioni esterne sono TLS; HTTP → redirect 301

events {
    worker_connections 4096;
    use epoll;
}

http {
    # ── Sicurezza ────────────────────────────────────────────────────────────
    server_tokens off;
    add_header X-Frame-Options          DENY;
    add_header X-Content-Type-Options   nosniff;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";

    # Rate limiting — protegge endpoints auth da brute force
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;

    # ── Upstream ─────────────────────────────────────────────────────────────
    upstream mesh_backend {
        server invisible-mesh:8080;
        keepalive 32;
    }
    upstream signal_backend {
        server invisible-signaling:8081;
        keepalive 64;
    }
    upstream relay_backend {
        server invisible-relay:8082;
        keepalive 64;
    }
    upstream admin_backend {
        server invisible-admin:8084;
        keepalive 8;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 308 https://$host$request_uri;
    }

    # ── HTTPS main ────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # TLS 1.3 only — massima sicurezza
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;

        # ── Health check (senza rate limit) ──────────────────────────────────
        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── Mesh Gateway API ─────────────────────────────────────────────────
        location /v1/mesh/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://mesh_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Signaling WebSocket ───────────────────────────────────────────────
        location /v1/signal {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://signal_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ── Legal / ToS ───────────────────────────────────────────────────────
        location /v1/tos/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://admin_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        # ── Admin Dashboard (protetto da token) ───────────────────────────────
        location /admin/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://admin_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Error reporting dall'app (pubblico, rate limited) ─────────────────
        location = /v1/errors {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://admin_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        # ── Auto-cancellazione account (firmata dall'app) ─────────────────────
        location = /v1/account {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://admin_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        # ── Relay WebSocket ───────────────────────────────────────────────────
        location /v1/relay {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://relay_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }
    }
}
