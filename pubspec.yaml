name: invisible
description: "Secure peer-to-peer encrypted messaging app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Crittografia
  cryptography: ^2.7.0
  pointycastle: ^3.7.4

  # Database
  sqflite_sqlcipher: ^2.2.1
  path: ^1.8.3
  flutter_secure_storage: ^9.0.0

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^4.0.1

  # Rete
  web_socket_channel: ^3.0.3
  http: ^1.2.0
  crypto: ^3.0.3
  share_plus: ^10.0.0

  # Chiamate WebRTC (cifrate E2E in rete mesh)
  flutter_webrtc: ^1.3.1

  # Tunnel WireGuard mesh VPN
  wireguard_flutter: ^0.1.3

  # Permessi (camera, microfono, VPN)
  permission_handler: ^11.3.1

  # Media & Emoji
  emoji_picker_flutter: ^4.4.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0

  # Device info (per error reporting)
  device_info_plus: ^10.1.0

  # Utils
  uuid: ^4.2.1
  intl: ^0.18.1
  path_provider: ^2.1.1

  # Icons
  cupertino_icons: ^1.0.8

  # Fonts
  google_fonts: ^6.2.1

  # Security
  safe_device: ^1.3.0
  shared_preferences: ^2.2.3

  # Notifiche locali (no FCM, nessun dato a Google)
  flutter_local_notifications: ^17.2.4

  # Audio — messaggi vocali
  record: ^5.1.2
  audioplayers: ^6.0.0

  # Video
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3

  # Posizione
  geolocator: ^13.0.2
  url_launcher: ^6.3.1

  # Wakelock — mantiene lo schermo acceso durante le chiamate
  wakelock_plus: ^1.1.4

dependency_overrides:
  record_linux: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
